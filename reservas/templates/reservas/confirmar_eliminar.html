{% extends 'base.html' %}
{% block title %}Eliminar Cancha{% endblock %}
{% block content %}
<div class="page-container" style="max-width:500px;text-align:center;">
    <div class="auth-card" style="padding:48px 40px;">
        <p style="font-size:3rem;">&#128465;</p>
        <h2 style="margin-bottom:12px;">Eliminar cancha</h2>
        <p style="color:var(--gris-claro);margin-bottom:28px;">
            Estas seguro que deseas eliminar <strong>{{ cancha.nombre }}</strong>?<br>
            Esta accion no se puede deshacer.
        </p>
        <form method="post" style="display:flex;gap:12px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-block">Si, eliminar</button>
            <a href="{% url 'admin_panel' %}" class="btn btn-outline btn-block">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
